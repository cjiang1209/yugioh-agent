[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yugioh-agent"
version = "0.1.0"
description = "Yu-Gi-Oh! RL environment powered by ygopro-core"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "numpy>=1.24",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
train = [
    "torch>=2.0",
    "tensorboard>=2.0",
    "setuptools<81",
    "mlflow>=3.0",
    "psutil>=5.9",
]
embed = [
    "sentence-transformers>=2.0",
]
mud = [
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
# Each package and its subpackages, named exactly. setuptools matches these by
# prefix, and leaderboard_data/ holds run output beside a package sharing its
# stem, so a bare "leaderboard*" reaches a directory that is not ours to ship.
include = [
    "core", "core.*",
    "env", "env.*",
    "rl", "rl.*",
    "mud", "mud.*",
    "leaderboard", "leaderboard.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--timeout=240 --timeout-method=thread"

[tool.ruff]
line-length = 100
src = ["core", "env", "rl", "mud", "leaderboard", "cli"]
extend-exclude = [
    "build",
    "third_party",
    ".venv",
    "web",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in default args (common with FastAPI/typer)
    "SIM108", # ternary-vs-if is a readability judgment call
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402"]  # `assert False` ok; tests use pytest.importorskip then import
"scripts/**" = ["E402"]        # scripts often set sys.path before imports
# message_parser/action_space import the engine constants table by `import *`;
# the surface is too large to enumerate and would churn on every engine update.
"env/message_parser.py" = ["F405"]
"env/action_space.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["core", "env", "rl", "mud", "leaderboard"]
